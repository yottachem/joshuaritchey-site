<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="canonical" href="{{ site.url }}/{{ canonical }}">
<meta property="og:type" content="profile">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ site.url }}/{{ canonical }}">
<meta property="og:image" content="{{ site.url }}/static/headshot.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: instrument notebook. A narrow margin rail carries mono section labels; content sits
   in the right column. The hero states the thesis next to a convergence schematic. */
:root {
  --paper: #f5f6f4;
  --surface: #ffffff;
  --ink: #15191b;
  --muted: #586064;
  --rule: #d3d8d5;
  --accent: #8f5000;      /* sodium D-line amber, text-safe */
  --beam: #e0952a;        /* same hue for drawn marks */
  --accent-soft: rgba(224, 149, 42, .14);
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --rail: 168px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1214; --surface: #161a1d; --ink: #e6e9e8; --muted: #9ba3a6; --rule: #2a3034;
    --accent: #f2b25a; --beam: #f0a33a; --accent-soft: rgba(240, 163, 58, .16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1214; --surface: #161a1d; --ink: #e6e9e8; --muted: #9ba3a6; --rule: #2a3034;
  --accent: #f2b25a; --beam: #f0a33a; --accent-soft: rgba(240, 163, 58, .16); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--font-body); }
img { max-width: 100%; display: block; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--beam); outline-offset: 3px; border-radius: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 24px; }

/* header */
.top { border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; padding-block: 18px; }
.brand { font: 600 19px/1 var(--font-display); color: var(--ink); text-decoration: none; margin-right: auto; }
.nav { display: flex; gap: 20px; font-size: 14px; }
.nav a { color: var(--muted); text-decoration: none; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--beam); }

/* sections with margin rail */
.sec { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 0 32px; padding-block: 44px; border-top: 1px solid var(--rule); }
.sec:first-child { border-top: 0; }
.label { font: 500 11px/1.4 var(--font-data); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }
.label span { display: block; color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; text-wrap: balance; margin: 0; }
h2 { font-size: 28px; line-height: 1.2; }
h3 { font-size: 21px; line-height: 1.25; }
.lede { max-width: 62ch; color: var(--muted); }
.mono { font-family: var(--font-data); font-size: 12.5px; letter-spacing: .02em; color: var(--muted); }

/* footer */
.foot { border-top: 1px solid var(--rule); }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 6px 24px; padding-block: 22px 36px; font-size: 13px; color: var(--muted); }
.foot a { color: inherit; }

/* contact address */
.addr { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.addr a { font: 500 17px/1.3 var(--font-data); }
.copy { font: 500 12px/1 var(--font-data); color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 7px 10px; cursor: pointer; }
.copy:hover { border-color: var(--muted); }

@media (max-width: 760px) {
  .sec { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 32px; }
  .wrap { padding-inline: 18px; }
}
{% block css %}{% endblock %}
</style>
{% if site.analytics_token %}<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ site.analytics_token }}"}'></script>{% endif %}
<script type="application/ld+json">{{ person_ld | safe }}</script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">{{ career.short_name }}</a>
  <nav class="nav" aria-label="Site">
    <a href="index.html"{% if page == "index" %} aria-current="page"{% endif %}>About</a>
    <a href="cv.html"{% if page == "cv" %} aria-current="page"{% endif %}>CV</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</div></header>
<main class="wrap">
{% block main %}{% endblock %}
</main>
<footer class="foot"><div class="wrap">
  <span>{{ career.name }} · {{ career.location }}</span>
  <a href="{{ career.linkedin }}">LinkedIn</a>
  <span class="js-addr-text"></span>
</div></footer>
<script>
(function () {
  var u = {{ site.email_user | tojson }}, d = {{ site.email_domain | tojson }}, a = u + "@" + d;
  document.querySelectorAll(".js-addr").forEach(function (el) { el.textContent = a; el.href = "mailto:" + a; });
  document.querySelectorAll(".js-addr-text").forEach(function (el) { el.textContent = a; });
  document.querySelectorAll(".copy").forEach(function (b) {
    b.addEventListener("click", function () {
      var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(a).then(done, function () {
        var r = document.createRange(), t = document.querySelector(".js-addr");
        if (t) { r.selectNodeContents(t); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      });
    });
  });
})();
</script>
</body>
</html>
