name: Joshua A. Ritchey, Ph.D.
short_name: Josh Ritchey
location: Greater Boston
linkedin: https://www.linkedin.com/in/joshua-ritchey

summary: >-
  R&D and product development leader with 15+ years building and commercializing analytical,
  assay, and instrumentation platforms in life sciences and diagnostics. Unifies optics,
  spectroscopy, nanofabrication, electronics, software, and chemistry into a single technical
  system, then carries it through funding, regulated manufacturing (ISO-9001, 21 CFR Part 11),
  and launch. Grounded in materials chemistry, with a hands-on, experimental approach to technical
  leadership and a record of developing direct reports into leadership roles.

roles:
  - company: Nonlinear CDR
    context: Carbon dioxide removal startup; biobased materials R&D and scale-up
    domain: Ulva-based bioplastics, carbon removal
    titles:
      - {title: Technical Advisor, start: 2025, end: present}
    highlights:
      - Lead hands-on development of Ulva-based bioplastic materials for the company's growth tanks, including in-house mechanical test methods that shorten formulation iteration.
      - Advise the founder on technical strategy, including in-house tank fabrication as a capital-efficient path to scale.
      - Write grant proposals; the company was selected for the CleanTech Open 2026 cohort.

  - company: Nirrin Technologies
    context: Scanning-laser NIR spectroscopy for bioprocess analytics (PAT)
    domain: NIR spectroscopy for bioprocessing
    titles:
      - {title: "Vice President, Product Development", start: 2025, end: 2025}
    highlights:
      - Led product development for Atlas, recognized with a 2025 R&D 100 Award (Analytical Test).
      - Led a cross-functional mechanical, electrical, and software team; introduced rapid prototyping, parallel workstreams, and CI/CD that cut software patch cycles from months to days.
      - Brought Atlas manufacturing, documentation, and supply chain in-house as the foundation for the next-generation platform.
      - Established the company's ISO-9001-aligned quality system, with 21 CFR Part 11 controls verified by third-party audit.

  - company: NanoMosaic
    context: Photonics-based protein quantitation and multi-omic assays for cell and gene therapy
    domain: Photonic protein quantitation, cell and gene therapy
    titles:
      - {title: Chief Technology Officer, start: 2022, end: 2024}
      - {title: "Vice President, Product Development", start: 2019, end: 2022}
    highlights:
      - Founding leadership team member; grew the technical organization from 2 to 25 staff and contributed to the $40MM Series A.
      - Led Tessie, a protein quantitation instrument with machine vision, onboard analysis, and consumable, from concept to beta in 18 months; personally rebuilt its first image analysis in Python and OpenCV, cutting analysis time per run from hours to minutes, and coded its customer data report.
      - Led instrument, consumable, and assay development for empty, partial, and full AAV capsid characterization, which earned FDA CBER Advanced Manufacturing Technology designation.
      - Led board and partner communication on technical strategy, roadmap, and IP diligence; served as technical lead for early-access customer programs.

  - company: Exosome Diagnostics
    context: Exosome quantitation with nanopore arrays and LSPR spectroscopy
    domain: LSPR nanopore sensing, IVD
    titles:
      - {title: Senior Development Scientist, start: 2018, end: 2018}
    highlights:
      - Led development of an IVD exosome detection platform, covering hardware and consumables.
      - Improved LSPR sensor performance through optimized antibody purification; coordinated external nanofabrication and software partners.

  - company: Bio-Rad Laboratories, Digital Biology Center
    context: Microfluidic droplet digital PCR
    domain: Microfluidics, ddPCR, FRET dyes
    titles:
      - {title: Senior Scientist to Staff Scientist, start: 2013, end: 2017}
    highlights:
      - Developed microfluidic antifouling surface treatments, resulting in three patents.
      - Led the dye synthesis program for eight individual FRET tandem dye products, and the spectroscopic normalization that resolved 4,096 droplet populations from five dyes.
      - Led surfactant system development for three individual products.
      - Managed two scientists, both since promoted to group leaders.

  - company: E Ink Corporation
    context: Electrophoretic display technology
    domain: Electrophoretic display materials
    titles:
      - {title: Scientist II, start: 2010, end: 2013}
    highlights:
      - Developed electrophoretic display materials, including ink microencapsulation methods and monodisperse nanoparticles.
      - Created polymerization methods and surfactants that supported color and transparent display technologies and multiple patents.

